services:
  cloudcli:
    build: .
    ports:
      - "${SERVER_PORT:-3001}:3001"
    environment:
      - SERVER_PORT=3001
      - HOST=0.0.0.0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      - CREWAI_BRIDGE_URL=http://crewai-bridge:8000
      - OCC_AGENTS_PATH=${OCC_AGENTS_PATH:-}
      - DATABASE_PATH=/app/data/auth.db
      - CONTEXT_WINDOW=${CONTEXT_WINDOW:-160000}
    volumes:
      - cloudcli-data:/app/data
    depends_on:
      9router:
        condition: service_started
      crewai-bridge:
        condition: service_started
    restart: unless-stopped

  9router:
    build:
      context: ${NINE_ROUTER_PATH:-../9router}
    ports:
      - "20128:20128"
    environment:
      - PORT=20128
    restart: unless-stopped

  crewai-bridge:
    build:
      context: ${CREWAI_STUDIO_PATH:-../CrewAI-Studio}
      dockerfile: bridge/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_BASE=http://9router:20128/v1
      - CREWAI_TRACING_ENABLED=false
      - AGENTOPS_ENABLED=False
    depends_on:
      9router:
        condition: service_started
    restart: unless-stopped

volumes:
  cloudcli-data:
